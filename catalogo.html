<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo · Hawkify</title>
<meta name="description" content="Busca herramientas por categoría, marca, tarifa por día, calificación y disponibilidad en tus fechas.">
<meta name="theme-color" content="#121a2c">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/paginas/catalogo.js"></script>
</head>
<body>
<div id="cabecera"></div>

<main class="contenedor">
  <div class="encabezado-pagina">
    <nav class="migas" aria-label="Ruta"><a href="index.html">Inicio</a><span>/</span><span>Catálogo</span></nav>
    <h1 id="titulo-catalogo">Catálogo de herramientas</h1>
    <p>Tarifa por día, disponibilidad real y calificaciones de quienes ya alquilaron.</p>
  </div>

  <div class="catalogo-layout">
    <aside class="filtros" id="filtros" aria-label="Filtros">
      <div class="filtros-cabecera-movil">
        <strong>Filtros</strong>
        <button class="icono-btn" type="button" id="cerrar-filtros" aria-label="Cerrar filtros"></button>
      </div>
      <div class="filtro">
        <h4>Buscar</h4>
        <input class="entrada" name="q" type="search" placeholder="Nombre, marca o uso" autocomplete="off">
      </div>
      <div class="filtro">
        <h4>Fechas de uso</h4>
        <div class="filtro-fechas">
          <input name="desde" type="date" aria-label="Desde">
          <input name="hasta" type="date" aria-label="Hasta">
        </div>
        <p class="ayuda tenue texto-pequeno mt-8">Mostramos solo lo que tiene una unidad libre durante todo el rango.</p>
        <label class="casilla mt-8"><input type="checkbox" name="soloDisponibles"> Libres hoy</label>
      </div>
      <div class="filtro">
        <h4>Categoría</h4>
        <div class="lista-opciones" id="f-categorias"></div>
      </div>
      <div class="filtro">
        <h4>Tarifa por día (COP)</h4>
        <div class="rango-precio">
          <input name="precioMin" type="number" min="0" step="1000" placeholder="Mínimo" inputmode="numeric">
          <input name="precioMax" type="number" min="0" step="1000" placeholder="Máximo" inputmode="numeric">
        </div>
      </div>
      <div class="filtro">
        <h4>Calificación mínima</h4>
        <div class="estrellas-filtro" id="f-estrellas"></div>
      </div>
      <div class="filtro">
        <h4>Marca</h4>
        <div class="lista-opciones" id="f-marcas"></div>
      </div>
      <div class="filtro">
        <button class="btn btn-linea btn-bloque" type="button" id="limpiar-filtros">Limpiar filtros</button>
      </div>
    </aside>

    <section aria-live="polite">
      <div class="barra-resultados">
        <div class="fila">
          <button class="btn btn-linea btn-sm boton-filtros-movil" type="button" id="abrir-filtros">Filtros</button>
          <span class="conteo" id="conteo"></span>
        </div>
        <label class="fila texto-pequeno">
          <span class="tenue">Ordenar</span>
          <select id="orden">
            <option value="relevancia">Más alquiladas</option>
            <option value="calificacion">Mejor calificadas</option>
            <option value="precio_asc">Tarifa: menor a mayor</option>
            <option value="precio_desc">Tarifa: mayor a menor</option>
            <option value="recientes">Recién publicadas</option>
          </select>
        </label>
      </div>
      <div class="chips" id="chips"></div>
      <div class="rejilla-fichas" id="resultados"></div>
      <div id="paginacion"></div>
    </section>
  </div>
</main>

<div id="pie"></div>
</body>
</html>
